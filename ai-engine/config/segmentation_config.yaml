# ════════════════════════════════════════════════════════════════
# KidneyStoneAI — Segmentation Configuration
# All training parameters are defined here.
# Override individual values via CLI flags where supported.
# ════════════════════════════════════════════════════════════════

# ── Dataset ──────────────────────────────────────────────────────
dataset:
  name: KSSD2025
  root: datasets/raw/segmentation/kssd2025
  image_dir: data/image
  label_dir: data/label

# ── Model ────────────────────────────────────────────────────────
model:
  name: unet            # options: unet  (future: unetplusplus, deeplab, fpn)
  in_channels: 1        # grayscale CT
  out_channels: 1       # binary mask
  base_features: 32     # doubles each U-Net level → 32, 64, 128, 256, 512

# ── Input ────────────────────────────────────────────────────────
input:
  size: 256             # spatial size for training (square)

# ── Training ─────────────────────────────────────────────────────
training:
  batch_size: 8
  epochs: 50
  learning_rate: 0.0001
  weight_decay: 0.0001
  optimizer: adam       # options: adam | adamw | sgd
  scheduler: reduce_on_plateau  # options: reduce_on_plateau | cosine_annealing | none
  scheduler_patience: 5
  scheduler_factor: 0.5
  early_stopping_patience: 10
  early_stopping_min_delta: 0.001
  num_workers: 0        # 0 = main process (safer on Windows)
  pin_memory: false

# ── Loss ─────────────────────────────────────────────────────────
loss:
  name: dice_bce        # options: dice | bce | dice_bce | bce_with_logits
  dice_weight: 0.5
  bce_weight: 0.5
  smooth: 1.0

# ── Augmentation ─────────────────────────────────────────────────
augmentation:
  enabled: true
  # Spatial (applied identically to image AND mask)
  horizontal_flip_prob: 0.5
  vertical_flip_prob: 0.3
  rotation_degrees: 10      # uniform in [-10, +10]
  # Intensity (image ONLY — never applied to mask)
  brightness_range: [0.8, 1.2]
  contrast_range: [0.8, 1.2]

# ── Data Splits ──────────────────────────────────────────────────
splits:
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15
  seed: 42
  output_dir: datasets/splits/segmentation

# ── Evaluation ───────────────────────────────────────────────────
evaluation:
  threshold: 0.5        # binary mask threshold applied to probability map
  metrics:
    - dice
    - iou
    - precision
    - recall
    - specificity
    - f1
    - pixel_accuracy
    - sensitivity

# ── Visualization ────────────────────────────────────────────────
visualization:
  enabled: true
  save_predictions: true
  save_overlays: true
  save_comparison: true
  save_tp_fp_fn: true
  num_samples: 20       # default number of test samples to visualize
  output_dir: outputs/segmentation/visualizations
  # Color config (RGB tuples)
  colors:
    overlay_stone: [255, 165, 0]    # orange — stone overlay on CT
    ground_truth: [0, 255, 0]       # green  — GT mask overlay
    prediction: [255, 165, 0]       # orange — predicted mask overlay
    true_positive: [0, 255, 0]      # green
    false_positive: [255, 0, 0]     # red
    false_negative: [0, 0, 255]     # blue
    bounding_box: [255, 255, 0]     # yellow

# ── Measurements ─────────────────────────────────────────────────
measurement:
  enabled: true
  min_region_area_pixels: 10    # ignore components smaller than this
  # Severity estimation — DISABLED by default.
  # Only enable if reliable pixel spacing (mm/pixel) is available.
  severity:
    enabled: false
    # small_max_mm: 6        # uncomment when pixel spacing is known
    # moderate_max_mm: 10
    # large_min_mm: 10
    disclaimer: >
      Severity is an experimental engineering heuristic only.
      It is NOT a clinical diagnosis. Do NOT use for medical decisions.

# ── Experiment Isolation ─────────────────────────────────────────
experiment:
  weights_root: ai-engine/weights/segmentation  # changed from weights/segmentation
  outputs_root: outputs/segmentation

# ── Reproducibility ──────────────────────────────────────────────
seed: 42
deterministic: true

# ── Smoke Test ───────────────────────────────────────────────────
smoke:
  epochs: 2
  samples: 50
  batch_size: 4
