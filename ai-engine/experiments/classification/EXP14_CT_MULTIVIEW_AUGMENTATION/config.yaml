# ════════════════════════════════════════════════════════════════════
# EXP14_CT_MULTIVIEW_AUGMENTATION — Configuration
# ════════════════════════════════════════════════════════════════════
#
# SCIENTIFIC QUESTION:
#   Does presenting the model with three complementary CT representations
#   (original + CLAHE + soft-edge) alongside CT-safe augmentation improve
#   external domain generalisation while preserving 4-class performance?
#
# INTENTIONAL CHANGES vs baseline:
#   1. 3-channel multi-view input  (original | CLAHE | soft-edge)
#   2. CT-appropriate augmentation (conservative rotations, intensity jitter)
#
# UNCHANGED from baseline:
#   Backbone (EfficientNet-B0), optimizer, LR, WD, scheduler, dropout,
#   batch-size, loss (CrossEntropy, no weighting), split, classes
# ════════════════════════════════════════════════════════════════════

experiment:
  id: EXP14_CT_MULTIVIEW_AUGMENTATION
  description: >
    4-class kidney CT classifier using three-channel multi-view input
    (original / CLAHE / soft-edge) with CT-safe augmentation.
  seed: 42
  deterministic: true

classes:
  names: [Normal, Cyst, Stone, Tumor]
  num_classes: 4
  label_map:
    Normal: 0
    Cyst:   1
    Stone:  2
    Tumor:  3

data:
  train_csv: datasets/splits/classification/train.csv
  val_csv:   datasets/splits/classification/val.csv
  test_csv:  datasets/splits/classification/test.csv

external:
  root: "datasets/raw/classification/additional_dataset/Kidney Stone Dataset/Original"
  expected_total: 3364
  stone_label: 2       # class index for Stone in the 4-class model
  threshold: 0.5       # fixed; not tuned on external data

model:
  backbone: efficientnet_b0   # UNCHANGED — isolates augmentation effect
  pretrained: true
  in_channels: 3              # 3 synthetic CT channels
  num_classes: 4
  dropout: 0.3

multiview:
  # Channel construction (applied per image at load time)
  channel_1: original_normalized   # L-channel of LAB converted to [0,1]
  channel_2: clahe                 # CLAHE-enhanced luminance
  channel_3: soft_edge             # Gaussian-blurred Sobel edge magnitude
  # CLAHE parameters
  clahe_clip_limit: 2.0
  clahe_tile_size: 8

augmentation:
  # Training only — val/test are always deterministic
  strategy: ct_multiview
  rotation_degrees: 10
  translate: 0.05
  scale_range: [0.95, 1.05]
  horizontal_flip_p: 0.5
  # NO vertical flip (anatomically unsafe for abdominal CT)
  brightness_jitter: 0.15
  contrast_jitter: 0.15
  gaussian_blur_p: 0.3
  gaussian_blur_sigma: [0.5, 1.5]
  # CT intensity perturbation (applied to raw uint8 before CLAHE)
  intensity_scale_range: [0.9, 1.1]
  gamma_range: [0.85, 1.15]

training:
  inherited_from_baseline: true
  intentional_changes:
    - three_channel_multiview_input
    - ct_safe_augmentation
  optimizer: adamw
  learning_rate: 0.001
  weight_decay: 0.0001
  batch_size: 32
  num_epochs: 50
  scheduler: cosine_annealing
  scheduler_T_max: 50
  early_stopping_patience: 10
  early_stopping_metric: val_macro_f1   # PRIMARY metric
  input_size: 224

output:
  dir: ai-engine/experiments/classification/EXP14_CT_MULTIVIEW_AUGMENTATION/outputs
  checkpoint_name: best_model_exp14_multiview.pth
  latest_name: latest_checkpoint_exp14.pth
